[project]
name = "drift-monitor"
version = "0.1.0"
description = "Drift monitoring project in bank data"
readme = "README.md"
authors = [
    { name = "Phijose J Philip", email = "phijosewiz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
drift-monitor = "drift_monitor:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
# Target a specific Python version (e.g., Python 3.13)
target-version = "py312"
# Set the maximum line length (88 is the default, matching Black)
line-length = 88
# Exclude directories that don't need linting or formatting
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable specific rule categories by their prefix
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (e.g., unused imports)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (code modernization)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify (code simplification)
]
# Explicitly ignore specific rules if necessary
ignore = [
    "E501", # Ignore line-length violations (let the formatter handle it)
]
# Allow fixing safe violations automatically on 'ruff check --fix'
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Configure code formatting style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# Minimum version of pytest required to run the tests
minversion = "6.0"
# Default command-line arguments passed to pytest
addopts = [
    "-ra",
    "-q",
    "--import-mode=importlib"
]
# Directories where pytest looks for tests
testpaths = [
    "tests",
]
# Register custom test markers to prevent warning errors
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "webtest: marks tests as requiring internet access",
]
# Configure how pytest handles specific warnings
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
